schema_version = "1.1"
prompt_version = "stage4-v2-evidence-groups"

[provider]
name = "openai"
model = "gpt-6.1-sol"
reasoning_effort = "medium"
store = false
max_output_tokens = 6000
request_timeout_seconds = 120
max_transport_attempts = 3
max_validation_attempts = 3
transport_backoff_seconds = 1.0

[interpretation]
max_hypotheses = 2
minimum_supported_signatures = 1
minimum_substantive_supported_signatures = 1
confidence_levels = ["low", "moderate", "high"]
context_only_confidence_cap = "low"
moderate_evidence_diversity_min_groups = 2
high_evidence_diversity_min_groups = 3

[evidence]
max_raw_items = 45
max_text_characters_per_item = 1800
max_deterministic_items = 80
max_context_items = 20
max_semantic_examples_per_preceding_event = 3
max_linked_action_examples_per_preceding_event = 2
max_role_agents_per_phase = 5

[cache]
reuse_validated_by_default = true
