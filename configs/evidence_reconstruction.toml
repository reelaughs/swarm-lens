[windows]
antecedent_minutes = 90
followup_minutes = 120
baseline_minutes = 120
# Zero inherits the Stage 2 recommended window size.
analysis_window_minutes = 0

[semantics]
max_features = 10000
ngram_min = 1
ngram_max = 2
min_df = 1
background_quantile = 0.95
threshold_floor = 0.20
threshold_ceiling = 0.80
fallback_threshold = 0.25
min_source_pair_background_pairs = 20
max_matches_per_preceding_event = 8
max_markdown_matches_per_preceding_event = 3

[antecedents]
top_n = 5
provisional_score_reference_threshold = 0.50
minimum_available_components = 3
uptake_agent_cap = 3
novelty_weight = 0.20
proximity_weight = 0.20
distinct_agent_uptake_weight = 0.20
detector_alignment_weight = 0.20
persistence_weight = 0.20

[antecedent_support]
# Each available dimension receives 0, 1, or 2 points. The final fraction is
# normalized by the maximum points for available dimensions only.
moderate_min_fraction = 0.40
strong_min_fraction = 0.70
uptake_moderate_other_agents = 1
uptake_strong_other_agents = 3
alignment_moderate = 0.25
alignment_strong = 0.50
persistence_moderate = 0.50
persistence_strong = 0.75
novelty_moderate = 0.50
novelty_strong = 0.75

[structure]
minimum_recurring_windows = 2
maximum_recurring_set_size = 3
minimum_specialization_observations = 2
minimum_specialization_windows = 2
maximum_reported_pairs = 10
maximum_reported_sets = 10

[persistence]
minimum_consecutive_windows = 2
