[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lens"
version = "0.1.0"
description = "Restartable ingestion and validation for AI Village research episodes"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "pyarrow>=18,<23",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
