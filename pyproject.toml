[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lens"
version = "0.1.0"
description = "Restartable ingestion and validation for AI Village research episodes"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=18,<23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
